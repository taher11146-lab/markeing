<svg viewBox="0 0 400 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chromeGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#735613"/>
      <stop offset="20%" stop-color="#D4AF37"/>
      <stop offset="40%" stop-color="#FFF3B3"/>
      <stop offset="60%" stop-color="#D4AF37"/>
      <stop offset="80%" stop-color="#9E781D"/>
      <stop offset="90%" stop-color="#FFF3B3"/>
      <stop offset="100%" stop-color="#543F0C"/>
    </linearGradient>
  </defs>

  <!-- الدائرة العلوية للرقم 8 -->
  <circle cx="250" cy="140" r="50" fill="none" stroke="url(#chromeGold)" stroke-width="22"/>
  <!-- الدائرة السفلية للرقم 8 -->
  <circle cx="250" cy="240" r="62" fill="none" stroke="url(#chromeGold)" stroke-width="22"/>
  <!-- العمود الرأسي الأساسي لحرف P -->
  <line x1="150" y1="90" x2="150" y2="290" stroke="url(#chromeGold)" stroke-width="22" stroke-linecap="round"/>
  <!-- القوس الجانبي المكمل لحرف P -->
  <path d="M 150 90 A 50 50 0 0 1 200 140 A 50 50 0 0 1 150 190" fill="none" stroke="url(#chromeGold)" stroke-width="22" stroke-linecap="round"/>

  <!-- التايبوغرافي -->
  <text x="200" y="375" fill="#D4AF37" font-size="52" font-weight="bold"
        text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif">PER8</text>
  <text x="200" y="410" fill="#A0AEC0" font-size="10" font-weight="600" letter-spacing="5"
